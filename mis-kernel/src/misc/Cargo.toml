[package]
name = "misc"
version = "0.1.0"
edition = "2021"
description = "MIS kernel compiler — letter-hash + EMBED 3..=6 (not Python)"
license = "Apache-2.0"

# Standalone — not tied to broken monorepo workspace members.
[workspace]

[[bin]]
name = "misc"
path = "src/main.rs"

[[bin]]
name = "clrtyc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
