[package]
name = "clrty-compiler-bridge"
version = "0.1.0"
edition = "2021"
description = "CLRTY-1 compiler bridge — IR emit stub with L1 probe"
license = "Apache-2.0"

# Standalone crate (not part of the parent monorepo workspace).
[workspace]

[features]
default = []
# Optional LLVM backend hook. Empty stub for now — no llvm-sys required for default build.
llvm = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[[bin]]
name = "clrty-compiler-bridge"
path = "src/main.rs"

[[bin]]
name = "smoke-clrty1"
path = "src/bin/smoke_clrty1.rs"

[[test]]
name = "clrty1_live"
path = "tests/clrty1_live.rs"
